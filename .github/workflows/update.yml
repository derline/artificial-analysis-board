name: Daily Data Update & Deploy to Pages

on:
  schedule:
    # 每天 UTC 00:00 (北京时间 08:00) 自动触发
    - cron: '0 0 * * *'
  push:
    branches:
      - main
  workflow_dispatch: # 支持在 GitHub 后台随时手动一键运行

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run data update script
        id: run_script
        run: node update_data.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html latest_data.json
          if git diff --staged --quiet; then
            echo "No data changes detected."
          else
            git commit -m "chore: automated daily data sync [skip ci]"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify on failure (Website Changed / Script Broken)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issueTitle = `🚨 [数据同步失败] 官网结构可能已改版 (${new Date().toISOString().split('T')[0]})`;
            const issueBody = `### 自动更新任务失败通知\n\n- **运行链接**: [查看 Action 运行日志](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n- **可能原因**: Artificial Analysis 官网前端发生改版、字段变更或网络受阻。\n- **处理建议**: 在开发工具中唤醒 Antigravity 助手，发送提示词：\`官网改版了，帮我检查并修复 update_data.js\`，即可快速自动修复。`;
            
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              creator: 'app/github-actions'
            });
            
            const existing = issues.data.find(i => i.title.startsWith('🚨 [数据同步失败]'));
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody
              });
            }
